<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Astro Tarot</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family: Arial, sans-serif; background:#100a1f; color:#f7f1e8; }
    .panel { width: min(420px, calc(100% - 32px)); background: rgba(18,12,34,.96); border: 1px solid rgba(212,168,67,.3); box-shadow: 0 24px 60px rgba(0,0,0,.35); border-radius: 22px; padding: 32px; }
    h1 { margin:0 0 16px; font-size: 1.75rem; letter-spacing: .08em; text-transform: uppercase; color:#f0c96a; }
    .tabs { display:flex; margin-bottom:24px; border-bottom:2px solid rgba(212,168,67,.2); }
    .tab { flex:1; padding:12px; background:none; border:none; color:#c084fc; cursor:pointer; font-size:1rem; border-bottom:2px solid transparent; transition:all 0.2s; }
    .tab.active { color:#f0c96a; border-bottom-color:#f0c96a; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    label { display:block; margin:16px 0 8px; font-size:.9rem; color:#ddd; }
    input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.12); background:#1a1327; color:#fff; }
    button { margin-top: 20px; width:100%; padding: 14px; border:none; border-radius:14px; background:#c084fc; color:#100a1f; font-weight:700; cursor:pointer; transition:background 0.2s; }
    button:hover { background:#d4a5ff; }
    button:disabled { opacity:.65; cursor:default; }
    .message { margin-top: 16px; min-height: 20px; font-size:.95rem; color:#f3c9a7; }
    .message.success { color:#8fd18f; }
    .actions { display:flex; justify-content:space-between; gap:12px; margin-top:16px; }
    .actions a { color:#c084fc; text-decoration:none; font-size:.9rem; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="back-link" style="text-align: center; margin-bottom: 20px;">
      <a href="/index.html" style="color: #c084fc; text-decoration: none; font-size: 0.9rem;">← Înapoi la site</a>
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="login">Autentificare</button>
      <button class="tab" data-tab="register">Cont Nou</button>
    </div>

    <!-- Login Tab -->
    <div class="tab-content active" id="login-tab">
      <h1>Autentificare</h1>
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="email@exemplu.ro" />
      <label for="loginPassword">Parolă</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Parola ta" />
      <button id="loginButton">Conectează-te</button>
      <div class="message" id="loginMessage"></div>
    </div>

    <!-- Register Tab -->
    <div class="tab-content" id="register-tab">
      <h1>Cont Nou</h1>
      <label for="registerName">Nume Complet</label>
      <input id="registerName" type="text" autocomplete="name" placeholder="Numele tău complet" />
      <label for="registerEmail">Email</label>
      <input id="registerEmail" type="email" autocomplete="email" placeholder="email@exemplu.ro" />
      <label for="registerPassword">Parolă</label>
      <input id="registerPassword" type="password" autocomplete="new-password" placeholder="Alege o parolă" />
      <label for="registerConfirmPassword">Confirmă Parola</label>
      <input id="registerConfirmPassword" type="password" autocomplete="new-password" placeholder="Reintrodu parola" />
      <button id="registerButton">Creează Cont</button>
      <div class="message" id="registerMessage"></div>
    </div>

    <div class="actions">
      <a href="/index.html">Înapoi la site</a>
      <a href="/admin.html">Admin</a>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
